<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flattens a photograph into a handful of values, so you can see the shapes light actually makes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Askance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Askance</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color:#201e1d">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter's service worker downloads a new deploy in the background but
    // leaves it "waiting" until every window of the old one has closed —
    // which an installed PWA effectively never does, so refreshing forever
    // still showed the previous build. The generated worker listens for a
    // 'skipWaiting' message; send it as soon as an update finishes
    // installing, and reload once when the new worker takes over.
    // Only armed when an old worker already controls the page: on the very
    // first visit there is nothing stale to replace, and the new worker
    // claiming the page must not trigger a pointless reload.
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then((reg) => {
        const promote = (sw) => {
          if (!sw) return;
          if (sw.state === 'installed') sw.postMessage('skipWaiting');
          else sw.addEventListener('statechange', () => {
            if (sw.state === 'installed') sw.postMessage('skipWaiting');
          });
        };
        promote(reg.waiting);
        reg.addEventListener('updatefound', () => promote(reg.installing));
        // A long-lived PWA window otherwise only checks on launch.
        setInterval(() => reg.update(), 60 * 60 * 1000);
      });
    }
  </script>
</body>
</html>
