name: askance
description: "A value-study tool for artists: flattens a photograph into a small number of values."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  idb_shim: ^2.6.5+1
  super_clipboard: ^0.10.0-dev.2
  printing: ^5.14.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  web: ^1.1.1
  flutter_webrtc: ^1.6.0
  mqtt_client: ^10.11.11
  cryptography: ^2.9.0
  qr: ^3.0.2
  mobile_scanner: ^7.4.0
  typed_data: ^1.4.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the autosave debounce be tested without waiting in real time.
  fake_async: ^1.3.2
  # Runs a test inside the real app on a real device, which is the only place
  # the smoothing passes can be timed: `flutter test` rasterises on the CPU,
  # so its numbers say nothing about a phone GPU.
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  shaders:
    - shaders/askance.frag
    - shaders/kuwahara.frag

  assets:
    # Onboarding shows the engine working on a real photograph rather than
    # describing it. Filipp Romanovski, via Unsplash.
    - assets/onboarding-portrait.jpg

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
