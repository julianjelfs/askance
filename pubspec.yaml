name: askance
description: "A value-study tool for artists: flattens a photograph into a small number of values."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  idb_shim: ^2.6.5+1
  super_clipboard: ^0.10.0-dev.2
  printing: ^5.14.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  in_app_purchase: ^3.2.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the autosave debounce be tested without waiting in real time.
  fake_async: ^1.3.2

flutter:
  uses-material-design: true

  shaders:
    - shaders/askance.frag

  assets:
    # Onboarding shows the engine working on a real photograph rather than
    # describing it. Filipp Romanovski, via Unsplash.
    - assets/onboarding-portrait.jpg

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
